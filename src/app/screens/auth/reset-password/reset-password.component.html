<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-container">
        <img src="/assets/logo-finly.png" alt="Finly Logo" class="main-logo">
      </div>
      <h2>Nova Senha</h2>
      <p>Crie uma nova senha segura para sua conta</p>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onResetPassword()">
      <div class="form-group">
        <label for="newPassword">Nova Senha</label>
        <input 
          type="password" 
          id="newPassword" 
          formControlName="newPassword" 
          placeholder="Sua nova senha"
          [class.invalid]="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched"
        >
        <div class="error-msg" *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched">
          Senha deve ter no mínimo 6 caracteres
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Nova Senha</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword" 
          placeholder="Confirme sua nova senha"
          [class.invalid]="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched"
        >
        <div class="error-msg" *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched">
          As senhas não coincidem
        </div>
      </div>

      <div class="alert error" *ngIf="error">
        {{ error }}
      </div>

      <div class="alert success" *ngIf="success">
        Senha alterada com sucesso! Redirecionando...
      </div>

      <button type="submit" [disabled]="passwordForm.invalid || loading" class="btn-login">
        {{ loading ? 'Processando...' : 'Alterar Senha' }}
      </button>
    </form>

    <div class="login-footer">
      <a routerLink="/login">Voltar para o Login</a>
    </div>
  </div>
</div>
