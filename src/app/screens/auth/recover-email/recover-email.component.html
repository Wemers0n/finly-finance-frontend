<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-container">
        <img src="/assets/logo-finly.png" alt="Finly Logo" class="main-logo">
      </div>
      <h2>Recuperar E-mail</h2>
      <p>Informe seu e-mail para validar sua conta</p>
    </div>

    <!-- Step 1: Verify Email -->
    <form [formGroup]="emailForm" (ngSubmit)="onVerifyEmail()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="seu@email.com"
          [class.invalid]="emailForm.get('email')?.invalid && emailForm.get('email')?.touched"
        >
        <div class="error-msg" *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
          E-mail inválido
        </div>
      </div>

      <div class="alert error" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" [disabled]="emailForm.invalid || loading" class="btn-login">
        {{ loading ? 'Validando...' : 'Validar E-mail' }}
      </button>
    </form>

    <div class="login-footer">
      <a routerLink="/login">Voltar para o Login</a>
    </div>
  </div>
</div>
